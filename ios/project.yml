name: WhatsAppTranslator
options:
  bundleIdPrefix: com.vultuk
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: SUR6QUSSV6
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 13
    MARKETING_VERSION: 1.0.0
targets:
  WhatsAppTranslator:
    type: application
    platform: iOS
    sources:
      - path: WhatsAppTranslator
      - path: Shared/NotificationPersonIdentity.swift
    dependencies:
      - target: WhatsAppTranslatorNotificationService
        embed: true
      - target: WhatsAppTranslatorIntents
        embed: true
    entitlements:
      path: WhatsAppTranslator/WhatsAppTranslator.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.siri: true
        com.apple.developer.usernotifications.communication: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
          - $(AppIdentifierPrefix)com.vultuk.whatsapptranslator.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vultuk.whatsapptranslator
        PRODUCT_NAME: WhatsAppTranslator
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    info:
      path: WhatsAppTranslator/Info.plist
      properties:
        CFBundleDisplayName: Babel Bridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Connect to your self-hosted Babel Bridge backend.
        NSSiriUsageDescription: Send and read translated messages with Siri, Apple Watch, and CarPlay.
        KeychainAccessGroup: $(AppIdentifierPrefix)com.vultuk.whatsapptranslator.shared
        NSUserActivityTypes:
          - INSendMessageIntent
          - INSearchForMessagesIntent
          - INSetMessageAttributeIntent
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  WhatsAppTranslatorNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: WhatsAppTranslatorNotificationService
      - path: Shared/NotificationPersonIdentity.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vultuk.whatsapptranslator.notification-service
        PRODUCT_NAME: NotificationService
        SKIP_INSTALL: true
    info:
      path: WhatsAppTranslatorNotificationService/Info.plist
      properties:
        CFBundleDisplayName: Babel Bridge Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  WhatsAppTranslatorIntents:
    type: app-extension
    platform: iOS
    sources:
      - path: WhatsAppTranslatorIntents
      - path: WhatsAppTranslator/Models/APIModels.swift
      - path: WhatsAppTranslator/Models/ServerConfiguration.swift
      - path: WhatsAppTranslator/Services/APIClient.swift
      - path: WhatsAppTranslator/Services/CredentialStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vultuk.whatsapptranslator.intents
        PRODUCT_NAME: WhatsAppTranslatorIntents
        SKIP_INSTALL: true
    entitlements:
      path: WhatsAppTranslatorIntents/WhatsAppTranslatorIntents.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.vultuk.whatsapptranslator.shared
    info:
      path: WhatsAppTranslatorIntents/Info.plist
      properties:
        CFBundleDisplayName: Babel Bridge Messaging
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KeychainAccessGroup: $(AppIdentifierPrefix)com.vultuk.whatsapptranslator.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.intents-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).IntentHandler
          NSExtensionAttributes:
            IntentsSupported:
              - INSendMessageIntent
              - INSearchForMessagesIntent
              - INSetMessageAttributeIntent
  BabelBridgeMac:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: WhatsAppTranslator
        excludes:
          - WhatsAppTranslatorApp.swift
          - App/PushNotificationCoordinator.swift
          - App/MessagingIntentDonor.swift
          - en.lproj/AppIntentVocabulary.plist
          - Info.plist
          - WhatsAppTranslator.entitlements
      - path: BabelBridgeMac
    entitlements:
      path: BabelBridgeMac/BabelBridgeMac.entitlements
      properties:
        com.apple.developer.aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.usernotifications.communication: true
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
          - $(AppIdentifierPrefix)com.vultuk.whatsapptranslator.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vultuk.whatsapptranslator
        PRODUCT_NAME: Babel Bridge
        PRODUCT_MODULE_NAME: BabelBridgeMac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: true
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    info:
      path: BabelBridgeMac/Info.plist
      properties:
        CFBundleDisplayName: Babel Bridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        KeychainAccessGroup: $(AppIdentifierPrefix)com.vultuk.whatsapptranslator.shared
        LSApplicationCategoryType: public.app-category.social-networking
        NSLocalNetworkUsageDescription: Connect to your self-hosted Babel Bridge backend.
        NSUserActivityTypes:
          - INSendMessageIntent
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSHumanReadableCopyright: Copyright © 2026 Simon Skinner. Open source under the repository license.
  WhatsAppTranslatorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WhatsAppTranslatorTests
    dependencies:
      - target: WhatsAppTranslator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vultuk.whatsapptranslator.tests
        GENERATE_INFOPLIST_FILE: true
  BabelBridgeMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: BabelBridgeMacTests
    dependencies:
      - target: BabelBridgeMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vultuk.whatsapptranslator.macos-tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Babel Bridge.app/Contents/MacOS/Babel Bridge
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  WhatsAppTranslator:
    build:
      targets:
        WhatsAppTranslator: all
        WhatsAppTranslatorTests: [test]
    test:
      targets:
        - WhatsAppTranslatorTests
  BabelBridgeMac:
    build:
      targets:
        BabelBridgeMac: all
        BabelBridgeMacTests: [test]
    test:
      targets:
        - BabelBridgeMacTests
