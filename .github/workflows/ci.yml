name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: wa-bridge/go.mod
          cache-dependency-path: wa-bridge/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test Go bridge
        working-directory: wa-bridge
        run: go test ./...

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Test Rust backend
        run: cargo test

      - name: Run Rust clippy
        run: cargo clippy

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Test frontend
        working-directory: web
        run: npm test
